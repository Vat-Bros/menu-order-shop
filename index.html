<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Menu Order</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <h1>📋 Menu Order</h1>

    <div class="search-wrap">
      <button
        id="searchToggle"
        class="search-toggle"
        type="button"
        aria-label="Search menu items"
        aria-expanded="true"
        aria-controls="searchInput"
      >
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m16 16 4 4" />
        </svg>
      </button>
      <input
        id="searchInput"
        type="search"
        placeholder="Search menu items..."
        aria-label="Search menu items"
      />
    </div>

    <div id="menu" class="grid"></div>

    <div class="cart">
      <div class="cart-header">
        <h2>🛒 Cart</h2>
        <button id="printReceipt" type="button" aria-label="Print receipt" title="Print receipt" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z" />
            <path d="M18 12h.01" />
          </svg>
        </button>
      </div>
      <div id="cart"></div>
      <h3 id="total">Total: ៛0.00</h3>
    </div>

    <section id="receipt" class="receipt" aria-hidden="true"></section>

    <div id="imageModal" class="image-modal" aria-label="Menu photo slideshow" aria-hidden="true">
      <button id="closeSlideshow" class="slideshow-close" type="button" aria-label="Close slideshow">×</button>
      <button id="previousSlide" class="slideshow-control" type="button" aria-label="Previous photo">‹</button>
      <div class="slideshow-frame">
        <img id="fullImage" alt="Menu item" />
        <div class="slideshow-zoom-controls" aria-label="Photo zoom controls">
          <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        </div>
      </div>
      <button id="nextSlide" class="slideshow-control" type="button" aria-label="Next photo">›</button>
    </div>
  </body>
</html>
